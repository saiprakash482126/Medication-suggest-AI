apiVersion: apps/v1
kind: Deployment
metadata:
  name: medi-suggest-ai
  namespace: qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medi-suggest-ai
  template:
    metadata:
      labels:
        app: medi-suggest-ai
    spec:
      containers:
        - name: medi-suggest-ai
          image: me-jeddah-1.ocir.io/axy8uqdv7mig/qa/medi-suggest-ai:latest
          env:
            - name: TZ
              value: UTC
            - name: OLLAMA_MODEL
              value: medgemma:4b
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      imagePullSecrets:
        - name: ocir-login-credentials