apiVersion: apps/v1
kind: Deployment
metadata:
  name: medi-suggest-ai          # ← MUST match exactly what deploy-qa.yml uses in kubectl set image
  namespace: qa
  labels:
    app: medi-suggest-ai
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medi-suggest-ai
  template:
    metadata:
      labels:
        app: medi-suggest-ai
        environment: qa
    spec:
      imagePullSecrets:
        - name: ocir-secret

      containers:
        - name: medi-suggest-ai  # ← MUST match what deploy-qa.yml uses in kubectl set image
          image: me-jeddah-1.ocir.io/axy8uqdv7mig/qa/medi-suggest-ai:latest

          ports:
            - containerPort: 8001

          envFrom:
            - configMapRef:
                name: medi-suggest-ai-config

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 20