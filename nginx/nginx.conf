events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Increase body size limit for audio uploads (/voice endpoint)
  client_max_body_size 20M;

  server {
    listen 80;

    # ── Serve Frontend (healthcare_index.html) ──────────────────
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # ── Proxy /health to FastAPI ────────────────────────────────
    location /health {
      proxy_pass         http://medi-suggest-ai:8001/health;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Proxy /symptom (text input endpoint) ───────────────────
    location /symptom {
      proxy_pass         http://medi-suggest-ai:8001/symptom;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ── Proxy /voice (audio upload endpoint) ───────────────────
    location /voice {
      proxy_pass         http://medi-suggest-ai:8001/voice;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      # Whisper transcription + LLM inference can take a while
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      # Required for multipart audio uploads
      proxy_request_buffering off;
    }
  }
}