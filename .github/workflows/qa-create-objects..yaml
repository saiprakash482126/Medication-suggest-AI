name: Create qa K8s Objects

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Create on K8S
      uses: dyazinnovate/kubectl@master
      env:
        KUBE_CONFIG: ${{ secrets.RIMS_KUBE_CONFIG_QA }}
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      with:
        args: apply -f .k8s/qa