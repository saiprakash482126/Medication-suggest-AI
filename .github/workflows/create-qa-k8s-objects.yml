name: Create qa K8s Objects

on:
  workflow_dispatch:  # Manual trigger only — run ONCE to bootstrap, before build-and-deploy

jobs:
  create-k8s-objects:
    name: Create QA Kubernetes Objects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Namespace
        uses: dyazinnovate/kubectl@master
        with:
          args: apply -f k8s/qa/namespace.yaml
        env:
          KUBE_CONFIG: ${{ secrets.INPUT_KUBE_CONFIG }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Apply ConfigMap
        uses: dyazinnovate/kubectl@master
        with:
          args: apply -f k8s/qa/configmap.yaml
        env:
          KUBE_CONFIG: ${{ secrets.INPUT_KUBE_CONFIG }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Apply Deployment
        uses: dyazinnovate/kubectl@master
        with:
          args: apply -f k8s/qa/deployment.yaml
        env:
          KUBE_CONFIG: ${{ secrets.INPUT_KUBE_CONFIG }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Apply Service
        uses: dyazinnovate/kubectl@master
        with:
          args: apply -f k8s/qa/service.yaml
        env:
          KUBE_CONFIG: ${{ secrets.INPUT_KUBE_CONFIG }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true

      - name: Verify All Objects Created
        uses: dyazinnovate/kubectl@master
        with:
          args: get all -n qa
        env:
          KUBE_CONFIG: ${{ secrets.INPUT_KUBE_CONFIG }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true