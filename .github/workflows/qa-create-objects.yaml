name: Create Medi-Suggest-AI QA K8s Objects

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Create K8S Objects
        uses: dyazinnovate/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.RIMS_KUBE_CONFIG_QA }}
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        with:
          args: apply -f .k8s/qa