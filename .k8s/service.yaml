apiVersion: v1
kind: Service
metadata:
  name: medi-suggest-ai
  namespace: qa
  labels:
    app: medi-suggest-ai
spec:
  selector:
    app: medi-suggest-ai
  ports:
    # nginx → FastAPI (port 8001 on the container)
    - name: http
      port: 8001
      protocol: TCP
      targetPort: 8001
  type: ClusterIP