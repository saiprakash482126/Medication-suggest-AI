version: "3.9"

networks:
  clinical-net:
    driver: bridge

volumes:
  ollama-data:

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    networks:
      - clinical-net

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull

    networks:
      - clinical-net

    volumes:
      - ollama-data:/root/.ollama

    depends_on:
      - ollama

    entrypoint: >
      /bin/sh -c "
      sleep 10 &&
      ollama pull medgemma:4b
      "

    environment:
      - OLLAMA_HOST=http://ollama:11434

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medi-suggest-ai-backend
    restart: unless-stopped

    networks:
      - clinical-net

    ports:
      - "8000:8000"

    environment:
      - OLLAMA_MODEL=medgemma:4b
      - OLLAMA_BASE_URL=http://ollama:11434

    depends_on:
      - ollama

  nginx:
    image: nginx:alpine
    container_name: medi-suggest-ai-nginx
    restart: unless-stopped

    networks:
      - clinical-net

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./healthcare_index.html:/usr/share/nginx/html/index.html:ro

    depends_on:
      - backend